<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Conveniência Oliveira</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(circle at 50% 20%, #1c2130, #0e1117 70%);
    color: #e8eaf0; font-family: "Segoe UI", system-ui, sans-serif;
    border: 1px solid rgba(212,175,55,.25); border-radius: 10px; user-select: none;
  }
  .logo { font-size: 22px; font-weight: 700; color: #d4af37; letter-spacing: .3px; }
  .sub { font-size: 12px; color: #8b91a1; margin-top: -8px; }
  .bar { width: 300px; height: 5px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; width: 25%; background: linear-gradient(90deg,#d4af37,#f0d97a); border-radius: 4px; transition: width .25s ease; }
  .fill.indeterminate { width: 35%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0%{margin-left:-35%} 100%{margin-left:100%} }
  .status { font-size: 12px; color: #a8aebd; height: 16px; max-width: 340px; text-align: center;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <div class="logo">Conveniência Oliveira</div>
  <div class="sub">Sistema de Gestão Comercial</div>
  <div class="bar"><div class="fill indeterminate" id="fill"></div></div>
  <div class="status" id="status">Iniciando...</div>
<script>
  const fill = document.getElementById('fill');
  const status = document.getElementById('status');
  window.splashAPI?.onStatus(({ msg, pct }) => {
    if (msg) status.textContent = msg;
    if (typeof pct === 'number') {
      fill.classList.remove('indeterminate');
      fill.style.width = pct + '%';
    } else {
      fill.classList.add('indeterminate');
      fill.style.width = '';
    }
  });
</script>
</body>
</html>
